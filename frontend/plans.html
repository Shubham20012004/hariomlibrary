<html lang="en" class="scroll-smooth">

    <style>
        /* Use the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Add smooth transitions for a better user experience */
        .transition-all {
            transition: all 0.3s ease-in-out;
        }
        /* Simple scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Animations for toast and list items */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.4s ease forwards; }

        @keyframes fade-out {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }
        .animate-fade-out { animation: fade-out 0.3s ease forwards; }

    </style>
    <script>
        // Tailwind Dark Mode Configuration
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        indigo: { // Custom indigo to match the provided template
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        };
    </script>
</head>

    <script>
        // Define API Base URL
        const BASE_API_URL = 'http://localhost:5000/api/student'; // Make sure this matches your backend URL

        document.addEventListener('DOMContentLoaded', async () => {
            // --- Authentication Check ---
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')).name : 'Student'; // Get name from parsed user object
            const usernameDisplay = document.getElementById('usernameDisplay');

            if (!token) {
                window.location.href = 'index.html'; // Redirect to login if no token
                return; // Stop execution
            }
            if (username && usernameDisplay) {
                usernameDisplay.textContent = username;
            }

            // --- Element Selectors ---
            const logoutBtn = document.getElementById('logoutBtn');
            const toast = document.getElementById('toast');
            const todoList = document.getElementById('todo');
            const newTaskInput = document.getElementById('newTask');

            // Dynamic List Containers
            const plansList = document.getElementById('plansList');
            const assignmentsList = document.getElementById('assignmentsList');
            const examsList = document.getElementById('examsList');

            // Add Forms
            const addPlanForm = document.getElementById('addPlanForm');
            const planTitleInput = document.getElementById('planTitle');
            const planDateInput = document.getElementById('planDate');

            const addAssignmentForm = document.getElementById('addAssignmentForm');
            const assignmentTitleInput = document.getElementById('assignmentTitle');
            const assignmentDueDateInput = document.getElementById('assignmentDueDate');

            const addExamForm = document.getElementById('addExamForm');
            const examTitleInput = document.getElementById('examTitle');
            const examDateInput = document.getElementById('examDate');

            // Modal elements
            const confirmModal = document.getElementById('confirmModal');
            const confirmMessage = document.getElementById('confirmMessage');
            const confirmYesBtn = document.getElementById('confirmYesBtn');
            const confirmNoBtn = document.getElementById('confirmNoBtn');

            let currentConfirmAction = null; // Stores the callback function for the confirm button


            // --- Utility Functions ---

            /**
             * Formats a date string into a readable format (e.g., "Jun 15, 2025").
             * Handles cases where date is null or invalid by returning a placeholder.
             * @param {string} dateString The date string to format.
             * @returns {string} Formatted date string.
             */
            function formatDate(dateString) {
                if (!dateString) return 'No Date';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) { // Check for invalid date
                        return 'Invalid Date';
                    }
                    const options = { year: 'numeric', month: 'short', day: 'numeric' };
                    return date.toLocaleDateString(undefined, options);
                } catch (e) {
                    console.error("Error formatting date:", e);
                    return 'Invalid Date';
                }
            }

            /**
             * Calculates the number of days until a given date.
             * @param {string} dateString The target date string (e.g., 'YYYY-MM-DD').
             * @returns {string} A string indicating days left, days ago, or "Today".
             */
            function getDaysCountdown(dateString) {
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Normalize today to the start of the day

                const targetDate = new Date(dateString);
                targetDate.setHours(0, 0, 0, 0); // Normalize target date to the start of the day

                const diffTime = targetDate.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // Round up for remaining days

                if (diffDays === 0) {
                    return '<span class="text-green-500 dark:text-green-400 font-bold">Today!</span>';
                } else if (diffDays > 0) {
                    return `<span class="text-indigo-500 dark:text-indigo-400 font-semibold">${diffDays} days left</span>`;
                } else {
                    return `<span class="text-red-500 dark:text-red-400">${Math.abs(diffDays)} days ago</span>`;
                }
            }


            /**
             * Shows a toast notification with a message.
             * @param {string} message The message to display.
             * @param {string} type The type of toast ('success' or 'error').
             */
            const showToast = (message, type = 'success') => {
                toast.textContent = message;
                toast.classList.remove('bg-slate-900', 'bg-red-600', 'dark:bg-white', 'dark:bg-red-500', 'text-white', 'dark:text-slate-900');

                if (type === 'success') {
                    toast.classList.add('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900');
                } else { // 'error'
                    toast.classList.add('bg-red-600', 'dark:bg-red-500', 'text-white');
                }
                toast.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 3000);
            };

            /**
             * Generic function for making authenticated API requests.
             * @param {string} url The API endpoint (e.g., '/plans/my').
             * @param {string} method HTTP method (e.g., 'GET', 'POST', 'DELETE').
             * @param {object} data Optional: data to send in the request body for POST/PUT.
             * @returns {Promise<object>} The JSON response from the API.
             */
            async function makeApiRequest(url, method, data = null) {
                const headers = {
                    'Content-Type': 'application/json',
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`; // Attach token
                }

                const options = {
                    method,
                    headers,
                    body: data ? JSON.stringify(data) : null,
                };

                try {
                    const response = await fetch(`${BASE_API_URL}${url}`, options);
                    const result = await response.json();

                    if (!response.ok) {
                        // If response is not OK (e.g., 400, 401, 500), throw an error
                        throw new Error(result.message || `API Error: ${response.statusText}`);
                    }
                    return result;
                } catch (error) {
                    console.error(`API Request failed for ${url}:`, error);
                    showToast(error.message, 'error');
                    throw error; // Re-throw to be caught by specific handlers
                }
            }


            // --- Render Functions for Plans, Assignments, Exams ---

            /**
             * Renders items into a specified list element.
             * @param {Array<object>} items The array of items (plans, assignments, exams).
             * @param {HTMLElement} listElement The UL element to render into.
             * @param {string} itemType 'plan', 'assignment', or 'exam'.
             */
            const renderItems = (items, listElement, itemType) => {
                listElement.innerHTML = ''; // Clear existing items

                if (items.length === 0) {
                    listElement.innerHTML = `<li class="text-slate-500 dark:text-slate-400">No ${itemType}s added yet.</li>`;
                    return;
                }

                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between bg-slate-200 dark:bg-slate-600 p-3 rounded-lg animate-fade-in text-slate-800 dark:text-slate-200';
                    li.dataset.id = item._id; // Store item ID for deletion

                    let dateInfo = '';
                    // Note: Assuming 'date' property for plans and exams, 'dueDate' for assignments as per your backend route and model names.
                    if (itemType === 'plan') {
                        dateInfo = `Date: ${formatDate(item.date)}`;
                    } else if (itemType === 'assignment') {
                        dateInfo = `Due: ${formatDate(item.dueDate)}`;
                    } else if (itemType === 'exam') {
                        // **MODIFIED:** Add countdown for exams
                        const countdown = getDaysCountdown(item.examDate); // Use item.examDate for exams
                        dateInfo = `<span class="flex flex-col sm:flex-row sm:items-center">
                                         <span class="mr-2">Date: ${formatDate(item.examDate)}</span>
                                         <span class="text-sm">(${countdown})</span>
                                    </span>`;
                    }

                    li.innerHTML = `
                        <span class="flex-1 mr-2">${item.title || item.subject} - ${dateInfo}</span>
                        <button class="delete-btn text-slate-500 hover:text-red-500 transition-colors p-1 rounded-full" data-id="${item._id}" data-type="${itemType}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    `;
                    listElement.appendChild(li);
                });
            };

            // Initial data fetch and render
            const fetchAllData = async () => {
                await fetchAndRender('/plans', plansList, (data, el) => renderItems(data, el, 'plan')); // Corrected endpoint to /plans
                await fetchAndRender('/assignments', assignmentsList, (data, el) => renderItems(data, el, 'assignment')); // Corrected endpoint to /assignments
                await fetchAndRender('/exams', examsList, (data, el) => renderItems(data, el, 'exam')); // Corrected endpoint to /exams
                // Fetch and render To-Do list (if it has a backend API)
                // If To-Do is localStorage-based, it should be called directly
                loadTasks(); // Assuming addTask and loadTasks are local to this script
            };

            const fetchAndRender = async (endpoint, listElement, renderFunction) => {
                try {
                    const data = await makeApiRequest(endpoint, 'GET');
                    renderFunction(data, listElement);
                } catch (error) {
                    console.error(`Failed to fetch ${endpoint.split('/')[1] || 'items'}:`, error);
                    // showToast(`Failed to fetch ${endpoint.split('/')[1] || 'items'}`, 'error'); // Error already handled by makeApiRequest
                }
            };

            // --- Form Submission Handlers ---

            addPlanForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = planTitleInput.value.trim();
                const date = planDateInput.value; // Date input value is already in 'YYYY-MM-DD' format

                if (!title || !date) {
                    showToast('Please enter a title and date for the plan.', 'error');
                    return;
                }

                try {
                    await makeApiRequest('/plans', 'POST', { title, date }); // Endpoint is /plans for POST
                    showToast('Plan added successfully!');
                    planTitleInput.value = '';
                    planDateInput.value = '';
                    document.getElementById('planFormContainer').classList.add('hidden'); // Hide form after adding
                    await fetchAndRender('/plans', plansList, (data, el) => renderItems(data, el, 'plan')); // Re-fetch and render
                } catch (error) {
                    // Error handled by makeApiRequest
                }
            });

            addAssignmentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = assignmentTitleInput.value.trim();
                const dueDate = assignmentDueDateInput.value;

                if (!title || !dueDate) {
                    showToast('Please enter a title and due date for the assignment.', 'error');
                    return;
                }

                try {
                    await makeApiRequest('/assignments', 'POST', { title, dueDate }); // Endpoint is /assignments for POST
                    showToast('Assignment added successfully!');
                    assignmentTitleInput.value = '';
                    assignmentDueDateInput.value = '';
                    document.getElementById('assignmentFormContainer').classList.add('hidden');
                    await fetchAndRender('/assignments', assignmentsList, (data, el) => renderItems(data, el, 'assignment'));
                } catch (error) {
                    // Error handled by makeApiRequest
                }
            });

            addExamForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = examTitleInput.value.trim(); // Changed from 'subject' to 'title' to match common model structure
                const examDate = examDateInput.value; // Renamed to examDate for clarity in controller

                if (!title || !examDate) {
                    showToast('Please enter a title and date for the exam.', 'error');
                    return;
                }

                try {
                    await makeApiRequest('/exams', 'POST', { subject: title, examDate }); // Endpoint is /exams for POST, mapping to 'subject' and 'examDate' in backend
                    showToast('Exam added successfully!');
                    examTitleInput.value = '';
                    examDateInput.value = '';
                    document.getElementById('examFormContainer').classList.add('hidden');
                    await fetchAndRender('/exams', examsList, (data, el) => renderItems(data, el, 'exam'));
                } catch (error) {
                    // Error handled by makeApiRequest
                }
            });

            // --- Custom Confirmation Modal Logic ---
            function showCustomConfirm(message, onConfirmCallback) {
                confirmMessage.textContent = message;
                confirmModal.classList.remove('hidden');
                currentConfirmAction = onConfirmCallback;
            }

            function hideCustomConfirm() {
                confirmModal.classList.add('hidden');
                currentConfirmAction = null;
            }

            confirmYesBtn.addEventListener('click', () => {
                if (currentConfirmAction) {
                    currentConfirmAction();
                }
                hideCustomConfirm();
            });

            confirmNoBtn.addEventListener('click', () => {
                hideCustomConfirm();
            });


            // --- Generic Delete Handler (Delegation) ---
            document.addEventListener('click', async (e) => {
                if (e.target.closest('.delete-btn')) {
                    const button = e.target.closest('.delete-btn');
                    const itemId = button.dataset.id;
                    const itemType = button.dataset.type; // 'plan', 'assignment', 'exam'

                    showCustomConfirm(`Are you sure you want to delete this ${itemType}?`, async () => {
                        // This code runs ONLY if the user clicks "Yes" in the custom modal
                        try {
                            // Ensure the endpoint matches your backend routing for deletion
                            // e.g., /api/student/plans/:id, /api/student/assignments/:id, /api/student/exams/:id
                            await makeApiRequest(`/${itemType}s/${itemId}`, 'DELETE');
                            showToast(`${itemType.charAt(0).toUpperCase() + itemType.slice(1)} removed successfully!`);

                            // Add fade-out animation and then remove from DOM
                            const listItem = button.closest('li');
                            if (listItem) {
                                listItem.classList.add('animate-fade-out');
                                listItem.addEventListener('animationend', async () => {
                                    listItem.remove();
                                    // Re-fetch and render the list to ensure UI is up-to-date
                                    // based on the specific type of item deleted
                                    if (itemType === 'plan') {
                                        await fetchAndRender('/plans', plansList, (data, el) => renderItems(data, el, 'plan'));
                                    } else if (itemType === 'assignment') {
                                        await fetchAndRender('/assignments', assignmentsList, (data, el) => renderItems(data, el, 'assignment'));
                                    } else if (itemType === 'exam') {
                                        await fetchAndRender('/exams', examsList, (data, el) => renderItems(data, el, 'exam'));
                                    }
                                });
                            }
                        } catch (error) {
                            // Error handled by makeApiRequest
                        }
                    });
                }
            });

            // --- To-Do List (Local Storage based) ---
            function loadTasks() {
                todoList.innerHTML = ''; // Clear existing tasks
                let tasks = JSON.parse(localStorage.getItem('student_dashboard_tasks')) || [];
                if (tasks.length === 0) {
                    todoList.innerHTML = '<li class="text-slate-500 dark:text-slate-400">No tasks added yet.</li>';
                    return;
                }
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = `flex items-center justify-between bg-slate-200 dark:bg-slate-600 p-3 rounded-lg animate-fade-in text-slate-800 dark:text-slate-200 ${task.completed ? 'opacity-60 line-through' : ''}`;
                    li.innerHTML = `
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" class="form-checkbox h-5 w-5 text-indigo-600 rounded-md" ${task.completed ? 'checked' : ''} onclick="toggleTask(${index})">
                            <span class="ml-3">${task.text}</span>
                        </label>
                        <button class="text-slate-500 hover:text-red-500 transition-colors p-1 rounded-full" onclick="deleteTask(${index})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            window.addTask = () => {
                const taskText = newTaskInput.value.trim();
                if (taskText === '') {
                    showToast('Task cannot be empty.', 'error');
                    return;
                }
                let tasks = JSON.parse(localStorage.getItem('student_dashboard_tasks')) || [];
                tasks.push({ text: taskText, completed: false });
                localStorage.setItem('student_dashboard_tasks', JSON.stringify(tasks));
                newTaskInput.value = '';
                loadTasks();
                showToast('Task added!');
            };

            window.toggleTask = (index) => {
                let tasks = JSON.parse(localStorage.getItem('student_dashboard_tasks')) || [];
                if (tasks[index]) {
                    tasks[index].completed = !tasks[index].completed;
                    localStorage.setItem('student_dashboard_tasks', JSON.stringify(tasks));
                    loadTasks();
                    showToast('Task updated!');
                }
            };

            window.deleteTask = (index) => {
                showCustomConfirm('Are you sure you want to delete this task?', () => {
                    let tasks = JSON.parse(localStorage.getItem('student_dashboard_tasks')) || [];
                    if (tasks[index]) {
                        tasks.splice(index, 1);
                        localStorage.setItem('student_dashboard_tasks', JSON.stringify(tasks));
                        loadTasks();
                        showToast('Task deleted!');
                    }
                });
            };

            // --- Event Listeners ---
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('theme');
                showToast('You have been logged out.', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirect to login page
                }, 1000);
            });

            // Theme toggle logic (already present, just ensuring it's here)
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            const initialTheme = localStorage.getItem('theme');
            if (initialTheme === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleLightIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.add('hidden');
                themeToggleLightIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggleDarkIcon.classList.remove('hidden');
                    themeToggleLightIcon.classList.add('hidden');
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggleDarkIcon.classList.add('hidden');
                    themeToggleLightIcon.classList.remove('hidden');
                }
            });


            // Initial data fetch and render for all sections
            fetchAllData();
        });
    </script>
</body>
</html>
