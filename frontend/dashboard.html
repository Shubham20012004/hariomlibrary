<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="shortcut icon" href="assests/logo.png" type="image/x-icon">
    <title>Student Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* Use the Inter font family */
        body {
            font-family: "Inter", sans-serif;
        }

        /* Add smooth transitions for a better user experience */
        .transition-all {
            transition: all 0.3s ease-in-out;
        }

        /* Simple scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Fade-in animation for list items */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
    <script>
        // Tailwind Dark Mode Configuration
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };

        // Theme toggle logic to be executed immediately
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

        <main class="flex-1 p-6 lg:p-8 overflow-y-auto">

                        <textarea id="complaintMessage" placeholder="Describe your issue or feedback here..." required rows="4" class="w-full px-4 py-2 bg-slate-100 dark:bg-slate-700 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"></textarea>
                        <button type="submit" id="complaintSubmitBtn" class="w-full bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 dark:focus:ring-offset-slate-800 transition-all">

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 py-3 px-5 rounded-lg shadow-xl text-sm font-semibold opacity-0 translate-y-10 transition-all duration-300">
        Toast Message
    </div>
    <script>
        const BASE_API_URL = 'http://localhost:5000/api/student'; // IMPORTANT: Adjusted to student prefix

        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Selectors ---
            const planForm = document.getElementById('planForm');
            const planIdInput = document.getElementById('planId');
            const planTitleInput = document.getElementById('planTitle');
            const planDateInput = document.getElementById('planDate'); // Used for dueDate
            const planSubmitBtn = document.getElementById('planSubmitBtn');
            const planCancelEditBtn = document.getElementById('planCancelEditBtn');
            const plansList = document.getElementById('plansList');

            const assignmentForm = document.getElementById('assignmentForm');
            const assignmentIdInput = document.getElementById('assignmentId');
            const assignmentTitleInput = document.getElementById('assignmentTitle');
            const assignmentDueInput = document.getElementById('assignmentDue'); // Used for dueDate
            const assignmentSubmitBtn = document.getElementById('assignmentSubmitBtn');
            const assignmentCancelEditBtn = document.getElementById('assignmentCancelEditBtn');
            const assignmentList = document.getElementById('assignmentList');

            const examForm = document.getElementById('examForm');
            const examIdInput = document.getElementById('examId');
            const examTitleInput = document.getElementById('examTitle'); // Used for subject
            const examDateInput = document.getElementById('examDate');
            const examSubmitBtn = document.getElementById('examSubmitBtn');
            const examCancelEditBtn = document.getElementById('examCancelEditBtn');
            const examList = document.getElementById('examList');

            const complaintForm = document.getElementById('complaintForm');
            const complaintIdInput = document.getElementById('complaintId'); // Not used for student complaint submission
            const complaintMessageInput = document.getElementById('complaintMessage');
            const complaintSubmitBtn = document.getElementById('complaintSubmitBtn');
            const complaintCancelEditBtn = document.getElementById('complaintCancelEditBtn'); // Not used for student submission
            const complaintsList = document.getElementById('complaintsList');

            const logoutBtn = document.getElementById('logoutBtn');
            const markPresentBtn = document.getElementById('markPresentBtn');
            const markAbsentBtn = document.getElementById('markAbsentBtn');
            const toast = document.getElementById('toast');
            const welcomeUserNameSpan = document.getElementById('welcomeUserName');
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            // --- Theme Toggle Logic ---
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleLightIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.add('hidden');
                themeToggleLightIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggleDarkIcon.classList.remove('hidden');
                    themeToggleLightIcon.classList.add('hidden');
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggleDarkIcon.classList.add('hidden');
                    themeToggleLightIcon.classList.remove('hidden');
                }
            });

            // --- Toast Notification Function ---
            function showToast(message, type = 'success') {
                toast.textContent = message;
                // Reset classes
                toast.classList.remove('bg-slate-900', 'bg-red-600', 'dark:bg-white', 'dark:bg-red-500', 'text-white', 'dark:text-slate-900');

                if (type === 'success') {
                    toast.classList.add('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900');
                } else {
                    toast.classList.add('bg-red-600', 'dark:bg-red-500', 'text-white');
                }
                toast.classList.remove('opacity-0', 'translate-y-10');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 3000);
            };

            // Function to handle redirection on authentication failure
            function redirectToLogin(message = 'Authentication failed. Please log in again.') {
                showToast(message, 'error');
                console.warn("Redirecting to login:", message); // Debugging
                setTimeout(() => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    localStorage.removeItem('theme'); // Clear theme too, as it's tied to user session context
                    window.location.href = 'index.html'; // Redirect to index.html (your login page)
                }, 1500); // Give user time to see the toast before redirect
            }

            // --- Initial Authentication Check ---
            const token = localStorage.getItem('token');
            const userString = localStorage.getItem('user');
            let user = null;

            if (userString) {
                try {
                    user = JSON.parse(userString);
                } catch (e) {
                    console.error("Error parsing user from localStorage:", e);
                    redirectToLogin('Corrupted user data. Please log in again.');
                    return; // Stop execution if user data is corrupted
                }
            }

            // If no token or user data, redirect immediately
            // MODIFIED: Check for either user._id or user.id
            if (!token || !user || (!user._id && !user.id) || user.role !== 'student') {
                redirectToLogin('Access denied. Please log in as a student.');
                return; // Stop execution
            }

            // Display welcome message
            // MODIFIED: Use user.id as fallback for display if user.name or user.email are missing
            welcomeUserNameSpan.textContent = user.name || (user.email ? user.email.split('@')[0] : (user.id ? user.id.substring(0, 8) + '...' : 'User'));


            // --- Generic Fetch Functions ---
            async function fetchAndRender(endpoint, listElement, mapFn) {
                console.log(`Fetching data for ${endpoint}...`);
                try {
                    const response = await fetch(`${BASE_API_URL}${endpoint}`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });

                    if (response.status === 401 || response.status === 403) {
                        const errorData = await response.json();
                        redirectToLogin(errorData.message || 'Session expired or unauthorized. Please log in again.');
                        return;
                    }

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || `Failed to fetch from ${endpoint}`);
                    }

                    const data = await response.json();
                    listElement.innerHTML = ''; // Clear previous items

                    if (data.length === 0) {
                        listElement.innerHTML = `<p class="text-sm text-center text-slate-500 dark:text-slate-400 p-4">Nothing here yet. Add an item above!</p>`;
                        return;
                    }

                    listElement.innerHTML = data.map(item => {
                        // Use correct property based on schema (dueDate for plans/assignments, examDate for exams, createdAt for complaints)
                        const dateProp = item.dueDate || item.examDate || item.createdAt || item.date;
                        const formattedDateDisplay = dateProp ? new Date(dateProp).toLocaleDateString('en-US', { // en-US for standard MM/DD/YYYY
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        }) : 'No Date';
                        const formattedDateInput = dateProp ? new Date(dateProp).toISOString().split('T')[0] : '';
                        const itemMessage = item.message || ''; // For complaints

                        return mapFn(item, formattedDateDisplay, formattedDateInput, itemMessage);
                    }).join('');

                } catch (error) {
                    console.error(`Error fetching ${endpoint}:`, error);
                    listElement.innerHTML = `<p class="text-sm text-center text-red-500 dark:text-red-400 p-4">Could not load items: ${error.message}</p>`;
                    showToast(`Failed to load items: ${error.message}`, 'error');
                } finally {
                     // Re-attach listeners after rendering
                     addCrudButtonListeners();
                }
            }

            async function postPutData(endpoint, payload, itemType, isEdit = false) {
                const method = isEdit ? 'PUT' : 'POST';
                console.log(`Sending ${method} to ${endpoint} with payload:`, payload);
                try {
                    const response = await fetch(`${BASE_API_URL}${endpoint}`, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 401 || response.status === 403) {
                        const errorData = await response.json();
                        redirectToLogin(errorData.message || 'Session expired or unauthorized. Please log in again.');
                        return;
                    }

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || `Failed to ${method.toLowerCase()} ${itemType}`);
                    }

                    showToast(data.message || `${itemType} saved successfully!`, 'success');
                    // Refresh the relevant list
                    switch (itemType) {
                        case 'plan': fetchPlans(); resetPlanForm(); break;
                        case 'assignment': fetchAssignments(); resetAssignmentForm(); break;
                        case 'exam': fetchExams(); resetExamForm(); break;
                        case 'complaint': fetchComplaints(); resetComplaintForm(); break;
                        case 'attendance': /* Attendance is handled by specific buttons */ break;
                    }
                } catch (error) {
                    console.error(`Error ${method.toLowerCase()}ing ${itemType}:`, error);
                    showToast(`Failed to save ${itemType}: ${error.message}`, 'error');
                }
            }

            async function deleteData(endpoint, itemType, id) {
                // Using window.confirm for simplicity, in production a custom modal is better
                if (!confirm(`Are you sure you want to delete this ${itemType}?`)) {
                    return;
                }
                console.log(`Attempting to delete ${itemType} from ${endpoint}`);
                try {
                    const response = await fetch(`${BASE_API_URL}${endpoint}/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.status === 401 || response.status === 403) {
                        const errorData = await response.json();
                        redirectToLogin(errorData.message || 'Session expired or unauthorized. Please log in again.');
                        return;
                    }

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || `Failed to delete ${itemType}.`);
                    }

                    showToast(data.message || `${itemType} deleted successfully!`, 'success');
                    // Re-fetch data for the corresponding section
                    switch (itemType) {
                        case 'plan': fetchPlans(); break;
                        case 'assignment': fetchAssignments(); break;
                        case 'exam': fetchExams(); break;
                        case 'complaint': fetchComplaints(); break;
                        case 'timerSession': /* This dashboard doesn't display timer sessions directly here,
                                             but if it did, you'd call its fetch function here.
                                             The sidebar links to a separate timer.html, so this delete logic
                                             is just for completeness if you were to add timer sessions list here. */
                                             break;
                    }
                } catch (error) {
                    console.error(`Error deleting ${itemType}:`, error);
                    showToast(`Error deleting ${itemType}: ${error.message}`, 'error');
                }
            }

            // --- Form Submission Handlers (Add/Edit) ---

            function resetPlanForm() {

                    title: planTitleInput.value,
                    dueDate: planDateInput.value,

            // --- Attendance Handlers ---
            async function markAttendance(status) {
                try {
                    const response = await fetch(`${BASE_API_URL}/attendance`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status, date: new Date().toISOString() }) // Send current date
                    });

                    if (response.status === 401 || response.status === 403) {
                        const errorData = await response.json();
                        redirectToLogin(errorData.message || 'Session expired or unauthorized. Please log in again.');
                        return;
                    }

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.message || `Failed to mark attendance as ${status}`);
                    }
                    showToast(`Attendance marked as ${status}!`, 'success');
                    // No need to re-render attendance list here as it's assumed on a separate page
                } catch (error) {
                    console.error(`Error marking attendance as ${status}:`, error);
                    showToast(`Failed to mark attendance: ${error.message}`, 'error');
                }
            }

            markPresentBtn.addEventListener('click', () => markAttendance('present'));

            // --- CRUD Button Event Listeners (Edit/Delete) ---
            function addCrudButtonListeners() {
                // Attach listeners for Plans, Assignments, Exams
                plansList.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.onclick = () => {
                        planIdInput.value = btn.dataset.id;

                        planSubmitBtn.classList.add('bg-green-600', 'hover:bg-green-700', 'focus:ring-green-500');

                assignmentList.querySelectorAll('.edit-btn').forEach(btn => {

                        assignmentSubmitBtn.classList.add('bg-green-600', 'hover:bg-green-700', 'focus:ring-green-500');
                        assignmentCancelEditBtn.classList.remove('hidden');
                    };

                assignmentList.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = () => deleteData('/assignments', 'assignment', btn.dataset.id);

                examList.querySelectorAll('.edit-btn').forEach(btn => {

                        examIdInput.value = btn.dataset.id;
                        examTitleInput.value = btn.dataset.title; // Map to subject

                        examSubmitBtn.classList.add('bg-green-600', 'hover:bg-green-700', 'focus:ring-green-500');
                        examCancelEditBtn.classList.remove('hidden');
                    };
                });
                examList.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = () => deleteData('/exams', 'exam', btn.dataset.id);
                });

                complaintsList.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = () => deleteData('/complaints', 'complaint', btn.dataset.id);
                });
            }

            // --- Logout ---
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('theme'); // Clear theme too
                showToast('You have been logged out.', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirect to login page (index.html)
