<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="shortcut icon" href="assests/logo.png" type="image/x-icon">
    <title>Complaint Management | Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        xintegrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKx3nB+azPRl0sPUZZtP/eQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-all { transition: all 0.3s ease-in-out; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease forwards; }
        @keyframes fade-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }
        .animate-fade-out { animation: fade-out 0.3s ease forwards; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: { indigo: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81', } }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-all flex h-screen">

    <!-- Sidebar -->
    <aside class="w-64 flex-shrink-0 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all">
        <div class="h-16 flex items-center justify-center border-b border-slate-200 dark:border-slate-700">
            <h1 class="text-xl font-bold text-indigo-600 dark:text-indigo-400">📚 Admin Panel</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="admin-dashboard.html" data-section="overview" class="nav-link flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                <i class="fas fa-tachometer-alt w-5 h-5 mr-3"></i> Overview
            </a>
            <a href="user-management.html" data-section="users" class="nav-link flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                <i class="fas fa-users w-5 h-5 mr-3"></i> User Management
            </a>
            <a href="fees-management.html" data-section="fees" class="nav-link flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                <i class="fas fa-hand-holding-usd w-5 h-5 mr-3"></i> Fees Management
            </a>
            <a href="complaint-management.html" data-section="complaints" class="nav-link flex items-center px-4 py-2 text-sm font-medium rounded-lg bg-indigo-50 dark:bg-slate-700 text-indigo-700 dark:text-white">
                <i class="fas fa-exclamation-triangle w-5 h-5 mr-3"></i> Complaints
            </a>
            <a href="announcements-management.html" data-section="announcements" class="nav-link flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                <i class="fas fa-bullhorn w-5 h-5 mr-3"></i> Announcements
            </a>
        </nav>
        <div class="px-4 py-6 border-t border-slate-200 dark:border-slate-700">
            <button id="logoutBtn" class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium rounded-lg hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400">
                <i class="fas fa-sign-out-alt w-5 h-5 mr-3"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-bold">Complaint Management</h2>
                <p class="text-slate-500 dark:text-slate-400">Review and resolve user complaints.</p>
            </div>
            <div>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700">
                    <svg id="theme-toggle-dark-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                    <svg id="theme-toggle-light-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 5.05a1 1 0 010-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM3 11a1 1 0 100-2H2a1 1 0 100 2h1z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6 lg:gap-8">
            <!-- Complaint Management Section -->
            <section id="complaints" class="dashboard-section bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md hover:shadow-lg transition-shadow active">
                <h3 class="text-xl font-semibold mb-4 text-slate-800 dark:text-slate-200">Complaint List</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white dark:bg-slate-800 rounded-lg shadow-sm">
                        <thead>
                            <tr class="bg-slate-100 dark:bg-slate-700">
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">User</th>
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">Subject</th>
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">Message</th>
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">Status</th>
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">Date</th>
                                <th class="py-3 px-4 text-left text-sm font-medium text-slate-600 dark:text-slate-300">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="complaintsTableBody">
                            <tr><td colspan="6" class="text-center py-4 text-slate-500 dark:text-slate-400">Loading complaints...</td></tr>
                        </tbody>
                    </table>
                </div>
                <p id="complaintsMessage" class="mt-4 text-sm text-center text-slate-500 dark:text-slate-400 hidden"></p>
            </section>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 py-3 px-5 rounded-lg shadow-xl text-sm font-semibold opacity-0 translate-y-10 transition-all duration-300">
        Toast Message
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-xl text-center">
            <p id="confirmMessage" class="mb-4 text-lg font-semibold text-slate-800 dark:text-slate-200"></p>
            <div class="flex justify-center space-x-4">
                <button id="confirmYesBtn" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 dark:focus:ring-offset-slate-800">Yes</button>
                <button id="confirmNoBtn" class="bg-slate-300 text-slate-800 font-semibold py-2 px-4 rounded-lg hover:bg-slate-400 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 dark:focus:ring-offset-slate-800">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Link to the common JavaScript file -->
    <script src="admin-common.js"></script>
    <script>
        // Specific script for the Complaint Management page
        document.addEventListener('DOMContentLoaded', async () => {
            const complaintsTableBody = document.getElementById('complaintsTableBody');
            const complaintsMessage = document.getElementById('complaintsMessage');

            // --- Helper Functions (specific to this page) ---
            function showFormMessage(element, msg, type) {
                element.textContent = msg;
                element.classList.remove('hidden', 'text-green-600', 'text-red-600', 'text-blue-600', 'dark:text-green-400', 'dark:text-red-400', 'dark:text-blue-400');
                if (type === 'success') { element.classList.add('text-green-600', 'dark:text-green-400'); }
                else if (type === 'error') { element.classList.add('text-red-600', 'dark:text-red-400'); }
                else if (type === 'info') { element.classList.add('text-blue-600', 'dark:text-blue-400'); }
                element.classList.remove('hidden');
                setTimeout(() => { element.classList.add('hidden'); element.textContent = ''; }, 3000);
            }

            function clearFormMessage(element) { element.classList.add('hidden'); element.textContent = ''; }

            // --- Fetch Data Functions ---
            async function fetchComplaints() {
                complaintsTableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-slate-500 dark:text-slate-400">Loading complaints...</td></tr>';
                clearFormMessage(complaintsMessage);

                try {
                    // makeApiRequest and showToast are from admin-common.js
                    const complaints = await makeApiRequest('/complaints');
                    complaintsTableBody.innerHTML = '';

                    if (complaints.length === 0) {
                        showFormMessage(complaintsMessage, 'No complaints found.', 'info');
                        return;
                    }

                    complaints.forEach(complaint => {
                        const row = complaintsTableBody.insertRow();
                        row.classList.add('border-b', 'border-slate-200', 'dark:border-slate-700', 'last:border-b-0');
                        row.innerHTML = `
                            <td class="py-3 px-4 text-sm">${complaint.userId ? complaint.userId.name : 'N/A'}</td>
                            <td class="py-3 px-4 text-sm">${complaint.subject}</td>
                            <td class="py-3 px-4 text-sm">${complaint.message}</td>
                            <td class="py-3 px-4 text-sm">
                                <select data-id="${complaint._id}" class="status-select bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-md px-2 py-1 text-xs focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="pending" ${complaint.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="working on it" ${complaint.status === 'working on it' ? 'selected' : ''}>Working on it</option>
                                    <option value="solved" ${complaint.status === 'solved' ? 'selected' : ''}>Solved</option>
                                </select>
                            </td>
                            <td class="py-3 px-4 text-sm">${new Date(complaint.createdAt).toLocaleDateString()}</td>
                            <td class="py-3 px-4 text-sm">
                                <button data-id="${complaint._id}" class="delete-complaint-btn bg-red-500 text-white px-3 py-1 rounded-md text-xs font-semibold hover:bg-red-600 transition-colors">Delete</button>
                            </td>
                        `;
                    });

                    complaintsTableBody.querySelectorAll('.status-select').forEach(select => {
                        select.addEventListener('change', (e) => {
                            const complaintId = e.target.dataset.id;
                            const newStatus = e.target.value;
                            updateComplaintStatus(complaintId, newStatus);
                        });
                    });

                    complaintsTableBody.querySelectorAll('.delete-complaint-btn').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const complaintId = e.target.dataset.id;
                            // showCustomConfirm is from admin-common.js
                            showCustomConfirm(`Are you sure you want to delete this complaint?`, () => deleteComplaint(complaintId));
                        });
                    });

                } catch (error) {
                    console.error('Error fetching complaints:', error);
                    complaintsTableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500 dark:text-red-400">Failed to load complaints.</td></tr>';
                    showFormMessage(complaintsMessage, 'Failed to load complaints. ' + error.message, 'error');
                }
            }

            async function updateComplaintStatus(complaintId, newStatus) {
                try {
                    // makeApiRequest and showToast are from admin-common.js
                    const data = await makeApiRequest(`/complaints/${complaintId}/status`, 'PUT', { status: newStatus });
                    showToast(data.message || 'Complaint status updated successfully!', 'success');
                    fetchComplaints();
                } catch (error) {
                    console.error('Error updating complaint status:', error);
                    // Error handled by makeApiRequest
                }
            }

            async function deleteComplaint(complaintId) {
                try {
                    // makeApiRequest and showToast are from admin-common.js
                    const data = await makeApiRequest(`/complaints/${complaintId}`, 'DELETE');
                    showToast(data.message || 'Complaint deleted successfully!', 'success');
                    fetchComplaints();
                } catch (error) {
                    console.error('Error deleting complaint:', error);
                    // Error handled by makeApiRequest
                }
            }

            // --- Initial Load ---
            fetchComplaints();
        });
    </script>
</body>
</html>
