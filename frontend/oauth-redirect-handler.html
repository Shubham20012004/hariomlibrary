<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #334155;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #6366f1; /* Indigo color */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold mb-4">Authenticating with Google...</h1>
        <div class="spinner"></div>
        <p class="text-lg text-gray-600">Please wait while we log you in.</p>
        <p id="errorMessage" class="text-red-500 mt-4 hidden"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const userString = params.get('user');
            const errorMessageElement = document.getElementById('errorMessage');

            if (token && userString) {
                try {
                    const user = JSON.parse(decodeURIComponent(userString));
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('userRole', user.role); // Store role separately for convenience

                    console.log('OAuth successful. Token and user stored.');
                    console.log('User Role:', user.role);

                    // Redirect based on role
                    if (user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } catch (e) {
                    console.error('Error parsing user data or storing to localStorage:', e);
                    errorMessageElement.textContent = 'Authentication successful, but there was an error processing user data. Please try logging in again.';
                    errorMessageElement.classList.remove('hidden');
                    // Fallback to login page after a delay
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                }
            } else {
                console.error('OAuth failed: Token or user data missing from URL.');
                errorMessageElement.textContent = 'Authentication failed. Please try again.';
                errorMessageElement.classList.remove('hidden');
                // Fallback to login page after a delay
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            }
        });
    </script>
</body>
</html>
